name: APIsec Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Scan Python code
        run: python -m bandit -r app lab

      - name: Run functional and security tests
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Generate controlled simulation reports
        run: python -m lab.cli --output-dir reports

      - name: Upload test and simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.xml
            reports/*.json
            reports/*.md
          if-no-files-found: warn
          retention-days: 14

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag apisec-lab:ci .
